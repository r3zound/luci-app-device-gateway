name: Build OpenWrt 25.12 APK and legacy IPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.0/targets/mediatek/filogic/openwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  PACKAGE_NAME: luci-app-device-gateway

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download official OpenWrt 25.12 SDK
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "$SDK_URL" -o openwrt-sdk.tar.zst
          mkdir openwrt
          tar --use-compress-program=unzstd -xf openwrt-sdk.tar.zst -C openwrt --strip-components=1
          rm -f openwrt-sdk.tar.zst

      - name: Prepare feeds and package
        working-directory: openwrt
        run: |
          ./scripts/feeds update luci
          ./scripts/feeds install -a
          mkdir -p "package/${PACKAGE_NAME}"
          cp -a ../Makefile ../root ../htdocs "package/${PACKAGE_NAME}/"
          echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m" >> .config
          make defconfig

      - name: Preflight SDK toolchain and target
        working-directory: openwrt
        run: |
          set -u
          failed=0
          check_exec() {
            path="$1"
            if [ -x "$path" ]; then
              echo "PREFLIGHT OK: executable $path"
            else
              echo "PREFLIGHT FAIL: missing executable $path"
              failed=1
            fi
          }
          check_exec staging_dir/host/bin/make
          toolchain_dir="$(find staging_dir -maxdepth 1 -type d -name 'toolchain-*' -print -quit)"
          if [ -n "$toolchain_dir" ]; then
            echo "PREFLIGHT OK: toolchain directory $toolchain_dir"
            check_exec "$toolchain_dir/bin/gcc"
            check_exec "$toolchain_dir/bin/ld"
            check_exec "$toolchain_dir/bin/ar"
            if find "$toolchain_dir" -type f -name 'libgcc_s.so.*' -print -quit | grep -q .; then
              echo 'PREFLIGHT OK: libgcc_s.so found'
            else
              echo 'PREFLIGHT FAIL: libgcc_s.so not found'
              failed=1
            fi
          else
            echo 'PREFLIGHT FAIL: no staging_dir/toolchain-* directory found'
            failed=1
          fi
          for config in \
            '^CONFIG_TARGET_mediatek=y$' \
            '^CONFIG_TARGET_mediatek_filogic=y$' \
            '^CONFIG_ARCH="aarch64"$'; do
            if grep -q "$config" .config; then
              echo "PREFLIGHT OK: $config"
            else
              echo "PREFLIGHT FAIL: $config"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo 'PREFLIGHT SUMMARY: failed'
            exit 1
          fi
          echo 'PREFLIGHT SUMMARY: passed'
          make package/${PACKAGE_NAME}/compile V=s -j"$(nproc)"
          mkdir -p ../dist
          find bin/packages -type f -name "${PACKAGE_NAME}_*.apk" -print -exec cp -v {} ../dist/ \;
          test -n "$(find ../dist -type f -name "${PACKAGE_NAME}_*.apk" -print -quit)"

      - name: Build legacy IPK
        run: |
          sh build-ipk.sh dist

      - name: Inspect and validate package metadata
        run: |
          set -eu
          apk="$(find dist -maxdepth 1 -type f -name "${PACKAGE_NAME}_*.apk" -print -quit)"
          ipk="$(find dist -maxdepth 1 -type f -name "${PACKAGE_NAME}_*.ipk" -print -quit)"
          test -n "$apk"
          test -n "$ipk"
          file "$apk" "$ipk"
          sha256sum "$apk" "$ipk"
          apk_control="$(mktemp -d)"
          tar -tzf "$apk" | grep -Eq '(^|/)\.PKGINFO$'
          tar -tzf "$apk" | grep -Eq '(^|/)\.INSTALL$|(^|/)\.POST-INSTALL$|(^|/)\.POST-UPGRADE$|(^|/)\.TRIGGERS$' || true
          ipk_control="$(mktemp -d)"
          tar -xOzf "$ipk" ./control.tar.gz | tar -xzf - -C "$ipk_control"
          grep -q '^Package: luci-app-device-gateway$' "$ipk_control/control"
          grep -q '^Version: 1.0.1-1$' "$ipk_control/control"
          grep -q '^Architecture: all$' "$ipk_control/control"
          grep -q '^Depends: luci-base, flock$' "$ipk_control/control"
          tar -tzf "$ipk" | grep -qx './debian-binary'
          tar -tzf "$ipk" | grep -qx './data.tar.gz'
          tar -tzf "$ipk" | grep -qx './control.tar.gz'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-device-gateway-packages
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
